version: 2
updates:
  # Keeps the SHA-pinned actions current. The cooldown skips releases younger
  # than a week, so a compromised release is usually pulled before we adopt it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
